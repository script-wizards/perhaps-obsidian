name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: script-wizards/perhaps
          path: perhaps

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: perhaps/pnpm-lock.yaml

      - name: Build plugin
        working-directory: perhaps
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @scriptwizards/perhaps-engine build
          pnpm --filter @scriptwizards/perhaps-obsidian build

      - name: Check versions agree
        run: |
          tag="${GITHUB_REF_NAME}"
          root_version=$(jq -r .version manifest.json)
          built_version=$(jq -r .version perhaps/packages/obsidian/manifest.json)
          if [ "$tag" != "$root_version" ] || [ "$tag" != "$built_version" ]; then
            echo "tag $tag, root manifest $root_version, monorepo manifest $built_version: must all match"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            perhaps/packages/obsidian/main.js \
            perhaps/packages/obsidian/manifest.json \
            perhaps/packages/obsidian/styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from script-wizards/perhaps@$(git -C perhaps rev-parse --short HEAD)"
